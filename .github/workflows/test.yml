name: Run Tests

on:
  push:
    branches: [project_management]   # triggers on commit
  pull_request:
    branches: [project_management]   # triggers on PR

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      # ✅ Step 4: Run tests
      - name: Run pytest
        run: |
          pytest Packages/
